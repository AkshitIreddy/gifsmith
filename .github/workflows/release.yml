# Release: build, verify, publish to npm with **trusted publishing (OIDC)** —
# no NPM_TOKEN, no stored secret, no manual OTP. GitHub mints a short-lived
# OIDC token, npm exchanges it for a one-off publish credential, and provenance
# is attested automatically.
#
# Three ways to run it:
#
#   1. Push a version tag — the normal path. Publishes to npm AND creates the
#      GitHub Release.
#        npm version patch && git push --follow-tags
#
#   2. Run manually WITH a tag — publishes that existing tag to npm only.
#      Use when the tag/Release already exists and just npm is behind. Tick
#      "github_release" if you also want the Release created.
#
#   3. Run manually with NO tag — builds and verifies main, publishes nothing.
#      A safe way to check the pipeline is green.
#
# Every step is idempotent: a version already on npm is skipped, and an existing
# Release is left alone, so re-running is always safe.
#
# One-time setup on npmjs.com (see README › Releasing): package → Settings →
# Trusted Publisher → GitHub Actions, with **workflow filename `release.yml`**.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish to npm (e.g. v0.2.2). Leave blank to verify only.'
        required: false
        type: string
      github_release:
        description: 'Also create the GitHub Release for that tag'
        type: boolean
        default: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # REQUIRED — lets the runner mint the OIDC token npm exchanges

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Decide what this run does before touching the repo: which ref to build,
      # whether to publish, whether to cut a Release.
      - name: Resolve target
        id: t
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="$GITHUB_REF_NAME"; PUBLISH=true; RELEASE=true
          else
            TAG="${{ inputs.tag }}"
            if [ -n "$TAG" ]; then
              PUBLISH=true; RELEASE="${{ inputs.github_release }}"
            else
              PUBLISH=false; RELEASE=false
            fi
          fi
          {
            echo "tag=$TAG"
            echo "ref=${TAG:-$GITHUB_REF}"
            echo "publish=$PUBLISH"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "tag='${TAG:-<none>}'  publish=$PUBLISH  github_release=$RELEASE"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.t.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing requires Node >= 22.14.0.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # The runner images ship an npm below the trusted-publishing floor
      # (11.5.1), so upgrade before anything reads the registry.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) / node $(node --version)"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # A tag must describe the version it actually ships, or the release
      # history silently drifts from the registry.
      - name: Verify tag matches package.json
        if: steps.t.outputs.tag != ''
        run: |
          TAG="${{ steps.t.outputs.tag }}"; TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag ${{ steps.t.outputs.tag }} does not match package.json version $PKG"
            exit 1
          fi

      # Verify the *packaged artifact* — this is what consumers actually get,
      # and it catches the whole class of exports-map/files-field bugs that a
      # plain build never sees.
      - name: Verify the published artifact installs and imports
        run: |
          npm pack
          TARBALL="$(ls gifsmith-*.tgz)"
          echo "packed: $TARBALL ($(du -h "$TARBALL" | cut -f1))"
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL" > /dev/null
          node --input-type=module -e "
            import { render, timeline, web, probe, dryRun } from 'gifsmith';
            import { cursor, desktop } from 'gifsmith/props';
            const fns = { render, timeline, web, probe, dryRun, cursor, desktop };
            for (const [name, fn] of Object.entries(fns)) {
              if (typeof fn !== 'function') throw new Error('missing export: ' + name);
            }
            console.log('ESM exports OK:', Object.keys(fns).join(', '));
          "
          npx --no-install gifsmith help > /dev/null && echo "CLI bin OK"

      # Makes re-runs safe: npm rejects republishing a version, so skip it.
      - name: Check whether this version is already on npm
        id: npm
        run: |
          V="$(node -p "require('./package.json').version")"
          if npm view "gifsmith@$V" version > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::gifsmith@$V is already on npm — publish will be skipped."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "gifsmith@$V is not published yet."
          fi

      # No NODE_AUTH_TOKEN / NPM_TOKEN anywhere: npm detects the OIDC
      # environment and authenticates with it directly.
      - name: Publish to npm (trusted publishing)
        if: steps.t.outputs.publish == 'true' && steps.npm.outputs.already == 'false'
        run: npm publish --provenance --access public

      - name: Create the GitHub Release
        if: steps.t.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.t.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — leaving it untouched."
          else
            # The Release body is the CHANGELOG's section for this version, with
            # GitHub's generated commit list appended under it (the API appends
            # generated notes to whatever body you supply). The changelog is the
            # written account of WHY; the commit list is the record of what.
            VER="${TAG#v}"
            NOTES="$RUNNER_TEMP/notes.md"
            # NO BRACKET REGEX. The heading is "## [0.2.3](link)", and getting a
            # literal `[` through YAML, then the shell, then awk's own string
            # parser takes four backslashes and still warns — the first version
            # of this died with "invalid regexp: Unmatched [". `index()` needs
            # no escaping at all and says the same thing.
            has_section() {
              awk -v v="$VER" '/^## / && index($0, v) { f = 1 } END { exit !f }' CHANGELOG.md
            }
            if [ -f CHANGELOG.md ] && has_section; then
              awk -v v="$VER" '
                /^## / && index($0, v) { on = 1; next }
                on && /^## / { exit }
                on { print }
              ' CHANGELOG.md > "$NOTES"
              echo "" >> "$NOTES"
            else
              echo "::warning::no CHANGELOG.md section for $VER — falling back to the link only"
              : > "$NOTES"
            fi
            {
              echo "📖 **[Full changelog](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)**"
              echo ""
            } >> "$NOTES"
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" --generate-notes
            echo "Created Release $TAG"
          fi

      - name: Summary
        run: |
          V="$(node -p "require('./package.json').version")"
          {
            echo "### gifsmith $V"
            echo ""
            echo "- tag: \`${{ steps.t.outputs.tag || '—' }}\`"
            echo "- npm publish: ${{ steps.t.outputs.publish == 'true' && steps.npm.outputs.already == 'false' && 'published' || 'skipped' }}"
            echo "- GitHub Release: ${{ steps.t.outputs.release == 'true' && 'ensured' || 'skipped' }}"
          } >> "$GITHUB_STEP_SUMMARY"
